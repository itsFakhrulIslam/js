<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Storage</title>
  </head>
  <body style="text-align: center">
    <!-- set, get, remove to local storage -->
    <h1>Local Storage for Primitive</h1>
    <button onclick="setItemLS()">Set Item</button>
    <button onclick="getItemLS()">Get Item</button>
    <button onclick="removeItemLS()">Remove Item</button>

    <!-- set, get, remove to local storage -->
    <h1>Local Storage for Object</h1>
    <button onclick="setObjectLS()">Set Object</button>
    <button onclick="getObjectLS()">Get Object</button>
    <button onclick="removeObjectLS()">Remove Object</button>

    <!-- set, get, remove to local storage -->
    <h1>Local Storage for Array</h1>
    <button onclick="setArrayLS()">Set Array</button>
    <button onclick="getArrayLS()">Get Array</button>
    <button onclick="removeArrayLS()">Remove Array</button>

    <!-- all data clear -->
    <h1>Clear Data</h1>
    <button onclick="clearData()">Clear Data</button>

    <!-- script here -->
    <script src="./script.js"></script>
  </body>
</html>
